$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://runlog.org/schemas/entry/v1.json"
title: "Runlog Entry"
description: >
  Submission format for a Runlog knowledge entry. Every entry describes a
  claim about a third-party system in before/after form, with a verification
  block the signed verifier runs to confirm the claim is falsifiable.
  Ratified decisions in ./DECISIONS.md.

type: object
required:
  - unit_id
  - domain
  - version_constraints
  - failed_approach
  - working_approach
  - verification

additionalProperties: false

properties:

  # ─── Identity ────────────────────────────────────────────────────────────
  unit_id:
    type: string
    maxLength: 256
    pattern: "^[a-z0-9][a-z0-9-]{3,127}$"
    description: "Slug-form identifier. Matches filename without extension."

  domain:
    type: array
    minItems: 1
    maxItems: 64
    items:
      type: string
      maxLength: 256
      pattern: "^[a-z0-9][a-z0-9-]*$"
    description: >
      Domain tags. Must resolve to public sources at `runlog_submit` scope check
      (§7.0 of submission-format doc). At least one tag required.

  # ─── Version and scope ──────────────────────────────────────────────────
  version_constraints:
    type: object
    additionalProperties: false
    description: >
      Version pins that bound the claim. At least one of `runtime`, `packages`,
      `external_services`, or `spec` must be present so an entry is not
      version-floating. See DECISIONS §6 (version pinning) and §9 (asymmetric
      applicability via `claim_scope`).
    properties:
      runtime:
        $ref: "#/$defs/runtime_pin"
      packages:
        type: array
        maxItems: 256
        items:
          $ref: "#/$defs/package_pin"
      external_services:
        type: array
        maxItems: 256
        items:
          $ref: "#/$defs/external_service_pin"
      build_features:
        type: array
        maxItems: 256
        items:
          $ref: "#/$defs/build_feature_pin"
      spec:
        $ref: "#/$defs/spec_anchor"
      notes:
        type: string
        maxLength: 4096
    anyOf:
      - required: [runtime]
      - required: [packages]
      - required: [external_services]
      - required: [spec]

  claim_scope:
    description: "§9. Asymmetric version applicability."
    type: object
    additionalProperties: false
    required: [applies_when, outside_scope_disposition]
    properties:
      applies_when:
        $ref: "#/$defs/version_pin_subset"
      outside_scope_disposition:
        enum: [inapplicable, claim_holds, claim_inverted]

  # ─── Literals (§1) ──────────────────────────────────────────────────────
  literals:
    type: object
    maxProperties: 256
    description: >
      Categorized constants referenced by `$LITERAL_*` tokens elsewhere in the
      entry. Submission rule §4 enforces that every `$LITERAL_*` referenced in
      branches is declared here. See DECISIONS §1.
    patternProperties:
      "^\\$LITERAL_[A-Z0-9_]+$":
        type: object
        additionalProperties: false
        required: [value, reason, category]
        properties:
          value: {}
          reason:
            type: string
            minLength: 10
            maxLength: 4096
          category:
            enum: [public_constant, public_identifier, standard_name]
    additionalProperties: false

  # ─── Fixtures (§10) ─────────────────────────────────────────────────────
  fixtures:
    type: object
    maxProperties: 256
    description: >
      Named test fixtures referenced by `$FIXTURE_*` tokens in branches and
      contexts. Submission rule §5 enforces that every `$FIXTURE_*` referenced
      is declared here. See DECISIONS §10.
    patternProperties:
      "^\\$FIXTURE_[A-Z0-9_]+$":
        $ref: "#/$defs/fixture"
    additionalProperties: false

  # ─── Contexts (§7) ──────────────────────────────────────────────────────
  contexts:
    type: object
    maxProperties: 256
    description: "Multiple independent execution environments for the test."
    additionalProperties:
      $ref: "#/$defs/context"

  # ─── Branches ───────────────────────────────────────────────────────────
  failed_approach:
    $ref: "#/$defs/branch"
    description: >
      The branch that fails — what the developer tried first that did not work.
      Paired with `working_approach` to form the differential test. See `$defs/branch`.
  working_approach:
    $ref: "#/$defs/branch"
    description: >
      The branch that works — the resolution the developer arrived at. Paired with
      `failed_approach` to form the differential test. See `$defs/branch`.

  # ─── Verification ───────────────────────────────────────────────────────
  verification:
    $ref: "#/$defs/verification"
    description: >
      Verifier configuration: tier (`assertion_only` / `unit` / `integration`),
      isolation, mutations, timeout, and the optional cassette and runtime
      declarations. See `$defs/verification`.


# ─── Shared definitions ────────────────────────────────────────────────────
$defs:

  runtime_pin:
    type: object
    description: >
      Language or runtime version pin (e.g. `python >=3.10`, `node ^20`).
      See DECISIONS §6.
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        type: string
        maxLength: 256
        pattern: "^[a-z][a-z0-9_+-]*$"
      version:
        type: string
        maxLength: 256
        description: "Source-syntax version constraint; platform normalizes."

  package_pin:
    type: object
    description: >
      Library/package version pin in the package manager's native syntax
      (e.g. `^6.5.0`, `~6.5`, `>=7.0,<12.0`). See DECISIONS §5.
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        type: string
        maxLength: 256
      version:
        type: string
        maxLength: 256
        description: "Language-native version constraint; platform normalizes."

  external_service_pin:
    type: object
    description: >
      Pin against a third-party service (vendor/product, optional API version
      and endpoint, optional implemented spec).
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        maxLength: 256
        description: "Vendor or product name (e.g. aws-s3, cloudflare-workers)."
      api_version:
        type: string
        maxLength: 256
        description: "Service-defined API version label (e.g. 2006-03-01, v1)."
      api_endpoint:
        type: string
        maxLength: 1024
        description: "Optional URL of the service's primary API root."
      spec:
        type: string
        maxLength: 256
        description: "Identifier of the spec the service implements (e.g. S3, OAuth 2.0)."

  build_feature_pin:
    type: object
    description: >
      Compile-time or build-time feature flag pin (e.g. `avx2`, `sqlite_fts5`).
      `pin_strength` controls whether absence at run-verify time fails
      verification or is merely informational.
    additionalProperties: false
    required: [name, pin_strength]
    properties:
      name:
        type: string
        maxLength: 256
        description: "Compile/build feature flag name (e.g. avx2, sqlite_fts5)."
      min_version:
        type: string
        maxLength: 256
        description: "Minimum runtime/library version that exposes the feature."
      pin_strength:
        enum: [required, optional]
        description: >
          Whether the pin is load-bearing for verification. `required` fails
          verification if the build feature is absent at run-verify time;
          `optional` is informational only.

  spec_anchor:
    type: object
    description: >
      Pin against a written specification (RFC, standard, protocol doc) —
      name plus optional section/anchor for precise citation.
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        maxLength: 256
        description: "Spec name, e.g. RFC 7636."
      section:
        type: string
        maxLength: 256
        description: "Section heading or chapter within the spec."
      anchor:
        type: string
        maxLength: 256
        description: "Stable identifier within the section (e.g. an RFC clause number)."

  version_pin_subset:
    type: object
    description: >
      Subset of version_constraints that claim_scope.applies_when can pin on —
      intentionally excludes external_services, build_features, spec because
      asymmetric applicability is only modeled across language/package versions
      for v1. See DECISIONS §9.
    additionalProperties: false
    properties:
      runtime:
        $ref: "#/$defs/runtime_pin"
      packages:
        type: array
        maxItems: 256
        items:
          $ref: "#/$defs/package_pin"

  # ─── Fixture ─────────────────────────────────────────────────────────────
  fixture:
    description: >
      Tagged union of fixture kinds the verifier provisions before branch
      execution and tears down after. Each arm pins `kind` to a literal
      const, so JSON Schema's `oneOf` resolves unambiguously without
      needing the OAS `discriminator` keyword. See DECISIONS §10.
    oneOf:
      - $ref: "#/$defs/fixture_sparse_file"
      - $ref: "#/$defs/fixture_regular_file"
      - $ref: "#/$defs/fixture_directory"
      - $ref: "#/$defs/fixture_sqlite_database"
      - $ref: "#/$defs/fixture_postgres_database"
      - $ref: "#/$defs/fixture_redis_instance"
      - $ref: "#/$defs/fixture_docker_context"
      - $ref: "#/$defs/fixture_http_endpoint"
      - $ref: "#/$defs/fixture_sidecar_process"

  file_tree:
    type: object
    description: >
      Path-keyed map of file contents (relative paths → file body). Shared
      shape used by `fixture_directory.files` and `fixture_docker_context.files`.
    maxProperties: 1024
    additionalProperties: { type: string, maxLength: 65536 }

  fixture_sparse_file:
    type: object
    description: >
      Sparse-file fixture. `size` is advisory (capped at 64 GiB to allow
      large but not exabyte allocations); `content` selects how the
      verifier fills the holes when reads land on them.
    additionalProperties: false
    required: [kind, size, content]
    properties:
      kind: { const: sparse_file }
      # 64 GiB — sparse files are advisory size; allow large but not exabyte.
      size: { type: integer, minimum: 0, maximum: 68719476736 }
      content: { enum: [zero, random, pattern] }

  fixture_regular_file:
    type: object
    description: >
      Regular-file fixture with inline content and an optional Unix-style
      mode. The mode pattern is permissive on purpose; the verifier
      rejects setuid/setgid/sticky bits (>= 04000) at provisioning time.
    additionalProperties: false
    required: [kind, content]
    properties:
      kind: { const: regular_file }
      content: { type: string, maxLength: 65536 }
      # NOTE: downstream verifier MUST reject mode bits >= 04000
      # (setuid/setgid/sticky). Schema-level regex is permissive on purpose;
      # rejection lives in the verifier where octal arithmetic is natural.
      mode: { type: string, pattern: "^[0-7]{3,4}$" }

  fixture_directory:
    type: object
    description: >
      Directory fixture — a tree of inline files materialised before the
      branch runs. `files` uses the shared `file_tree` shape (path-keyed
      map of relative paths to file bodies).
    additionalProperties: false
    required: [kind, files]
    properties:
      kind: { const: directory }
      files:
        $ref: "#/$defs/file_tree"

  fixture_sqlite_database:
    type: object
    description: >
      SQLite database fixture. Pair with `context.kind: sqlite_connection`
      pointing `database:` at this fixture's `$FIXTURE_*` token. See
      `$defs/context` for the full pairing table.
    additionalProperties: false
    required: [kind]
    properties:
      kind: { const: sqlite_database }
      schema: { type: string, maxLength: 65536 }
      seed_data: { type: array, maxItems: 1024 }
      pragmas: { type: object, maxProperties: 64 }

  fixture_postgres_database:
    type: object
    description: >
      Postgres database fixture. Pair with `context.kind: postgres_connection`
      pointing `database:` at this fixture's `$FIXTURE_*` token. See
      `$defs/context` for the full pairing table.
    additionalProperties: false
    required: [kind]
    properties:
      kind: { const: postgres_database }
      schema: { type: string, maxLength: 65536 }
      seed_data: { type: array, maxItems: 1024 }
      extensions: { type: array, maxItems: 64, items: { type: string, maxLength: 256 } }

  fixture_redis_instance:
    type: object
    description: >
      Redis instance fixture. Pair with `context.kind: redis_connection`
      pointing `endpoint:` at this fixture's `$FIXTURE_*` token. See
      `$defs/context` for the full pairing table.
    additionalProperties: false
    required: [kind]
    properties:
      kind: { const: redis_instance }
      preloaded_keys: { type: object, maxProperties: 1024 }
      config: { type: object, maxProperties: 64 }

  fixture_docker_context:
    type: object
    description: >
      Docker build/runtime context fixture (Dockerfile + supporting files).
      Pair with `context.kind: docker_container` pointing `endpoint:` at this
      fixture's `$FIXTURE_*` token. See `$defs/context` for the full pairing
      table.
    additionalProperties: false
    required: [kind, files]
    properties:
      kind: { const: docker_context }
      files:
        $ref: "#/$defs/file_tree"

  fixture_http_endpoint:
    type: object
    description: >
      Cassette-backed HTTP fixture. Pair with `context.kind: http_endpoint`
      pointing `endpoint:` at this fixture's `$FIXTURE_*` token. See
      `$defs/context` for the full pairing table.
    additionalProperties: false
    required: [kind, cassette]
    properties:
      kind: { const: http_endpoint }
      cassette: { type: string, maxLength: 256 }

  fixture_sidecar_process:
    type: object
    description: >
      Long-running sidecar process whose lifecycle spans the branch action.
      The verifier starts the process before the branch action runs, waits
      for the `ready_when` signal (or the fixed delay), then runs the
      action with the sidecar still alive. On branch completion (success or
      failure), the verifier sends SIGTERM, waits up to `stop_grace_seconds`,
      then SIGKILL. Use for concurrent-writer fixtures, log-tailers,
      cache-flushers, watchdog daemons — any side-effect-producing process
      the action observes but does not control. `enabled: false` (typically
      set via a `mutate_fixture` mutation) skips the start, so actions that
      depend on the sidecar's presence yield a falsifying result.
    additionalProperties: false
    required: [kind, command]
    properties:
      kind: { const: sidecar_process }
      command:
        type: array
        description: >
          Argv array passed to `exec`. Inputs available to the branch
          (e.g. `$WORKDIR`, `$REDIS_URL`, declared `$LITERAL_*` and
          `$FIXTURE_*` tokens) are substituted before exec.
        minItems: 1
        maxItems: 64
        items: { type: string, maxLength: 4096 }
      against:
        type: string
        description: >
          Optional `$FIXTURE_*` token of the static fixture this sidecar
          targets (e.g. a `redis_instance` the writer mutates). The
          token-shape pattern is enforced here; the referent's existence
          in `fixtures:` is currently NOT cross-checked (rule §5 walks
          branch subtrees only, and `against:` lives under `fixtures.*`).
          Used by `replay_targets` authoring to make the writer/target
          relationship explicit.
        pattern: "^\\$FIXTURE_[A-Z0-9_]+$"
        maxLength: 256
      ready_when:
        description: >
          How the verifier decides the sidecar is ready before the branch
          action begins. Discriminated by the property name (exactly one
          of `stderr_regex`, `path_exists`, `delay_seconds`).
        oneOf:
          - type: object
            additionalProperties: false
            required: [stderr_regex]
            properties:
              stderr_regex:
                type: string
                description: >
                  Go regexp matched against the sidecar's stderr; the
                  driver waits for the first match (or the start-up
                  timeout, whichever fires first).
                maxLength: 1024
          - type: object
            additionalProperties: false
            required: [path_exists]
            properties:
              path_exists:
                type: string
                description: >
                  Filesystem path the driver polls until it appears.
                  Inputs are substituted before polling.
                maxLength: 4096
          - type: object
            additionalProperties: false
            required: [delay_seconds]
            properties:
              delay_seconds:
                type: number
                description: >
                  Fixed delay before declaring the sidecar ready. Use
                  when the process has no observable readiness signal.
                minimum: 0
                maximum: 60
      enabled:
        type: boolean
        description: >
          Whether the sidecar starts. Default true. Mutations that flip
          this to false (via `mutate_fixture target: $FIXTURE_*,
          new_value: false`) skip the start, falsifying actions that
          depend on the sidecar's side-effects.
        default: true
      stop_grace_seconds:
        type: integer
        description: >
          Seconds to wait after SIGTERM before sending SIGKILL on
          teardown.
        minimum: 0
        maximum: 60
        default: 5
      expose_pid:
        type: boolean
        description: >
          When true, the sidecar's PID is bound to the fixture's
          `$FIXTURE_*` token in branch inputs so the action can signal
          the sidecar (e.g. `kill -USR1 $FIXTURE_BG_WRITER`). Defaults
          to false; the action treats the sidecar as opaque.
        default: false

  # ─── Context ─────────────────────────────────────────────────────────────
  # A context is an execution environment an action_step can run inside (its
  # `context:` field names a key in top-level `contexts:`). The `kind:` enum
  # below names the connection or runtime category — it does NOT structurally
  # bind to a fixture declaration. To wire a context to a fixture, point the
  # connection-string field (`endpoint:` or `database:`) at a `$FIXTURE_*`
  # token; submission rule §5 catches missing references at submit time.
  #
  # Conventional pairings (advisory — verifier behavior, not schema-enforced):
  #
  #   context.kind: sqlite_connection   ↔  fixture kind: sqlite_database
  #   context.kind: postgres_connection ↔  fixture kind: postgres_database
  #   context.kind: redis_connection    ↔  fixture kind: redis_instance
  #   context.kind: http_endpoint       ↔  fixture kind: http_endpoint
  #   context.kind: docker_container    ↔  fixture kind: docker_context
  #   context.kind: subprocess          ↔  (no specific fixture; uses
  #                                          fixture_directory or sparse_file
  #                                          for working files)
  #   context.kind: browser_tab         ↔  (no specific fixture; uses
  #                                          cassette for replay)
  #
  # The decoupling is deliberate: a context can also point at a real running
  # service (e.g. an integration-tier `http_endpoint` against a cassetted
  # third-party API with no local fixture) where there is nothing to declare.
  context:
    type: object
    description: >
      Execution environment an action_step can run inside. `kind` names
      the connection or runtime category; `database`/`endpoint` typically
      reference a `$FIXTURE_*` token (see the pairing table above). See
      DECISIONS §7.
    additionalProperties: false
    required: [kind]
    properties:
      kind:
        enum:
          - sqlite_connection
          - postgres_connection
          - redis_connection
          - http_endpoint
          - browser_tab
          - subprocess
          - docker_container
      database:
        type: string
        maxLength: 1024
        description: >
          Reference to a `fixture_sqlite_database` or `fixture_postgres_database`
          by `$FIXTURE_*` token (load-bearing — the verifier resolves it when
          dispatching the branch's actions).
      endpoint:
        type: string
        maxLength: 1024
        description: >
          Reference to a `fixture_redis_instance`, `fixture_http_endpoint`, or
          `fixture_docker_context` by `$FIXTURE_*` token, or a real service URL
          (load-bearing — the verifier resolves it when dispatching the branch's
          actions).
      pragmas:
        type: object
        maxProperties: 64
        description: >
          SQLite PRAGMA overrides applied to the connection (paired with
          `kind: sqlite_connection`); load-bearing for the verifier's branch
          execution.
      config:
        type: object
        maxProperties: 64
        description: >
          Connection-level config overrides (paired with `kind: redis_connection`,
          and reserved for other connection kinds); load-bearing for the
          verifier's branch execution.

  # ─── Branch (failed_approach / working_approach) ─────────────────────────
  branch:
    type: object
    description: >
      One arm of the differential pair: a description, an optional setup,
      an action surface (single fragment, fragment array, or
      `action_steps_block`), and an assertion. Used by both `failed_approach`
      and `working_approach` at the top level.
    additionalProperties: false
    required: [description, assertion]
    properties:
      description:
        type: string
        minLength: 30
        maxLength: 4096
        description: >
          Human-readable summary of what this branch represents — why it
          fails (for `failed_approach`) or why it works (for `working_approach`).
      setup:
        type: array
        maxItems: 64
        items:
          $ref: "#/$defs/step_fragment"
      action:
        # Three-way oneOf with structural discriminators — the arms are
        # disambiguated by required-property shape, not the validator's
        # tie-breaking. Arm 1 (single fragment) carries
        # `additionalProperties: true` from `step_fragment`, so without
        # the `not` guard a document like `{type: code, steps: [...]}`
        # would pass arm 1 (steps treated as an "extra" field) AND
        # could plausibly read as arm 3. The `not: {required: [steps]}`
        # forbids arm 1 from claiming a document that has a `steps`
        # field. Arm 3's `additionalProperties: false` already forbids
        # `type` on its side, so the discrimination is symmetric.
        oneOf:
          - allOf:
              - $ref: "#/$defs/step_fragment"
              - not: { required: [steps] }
          - type: array
            maxItems: 64
            items:
              allOf:
                - $ref: "#/$defs/step_fragment"
                - not: { required: [steps] }
          - $ref: "#/$defs/action_steps_block"
      assertion:
        $ref: "#/$defs/assertion"

  # ─── Step kind enums ─────────────────────────────────────────────────────
  # `step_kind_base` is the shared set valid in any step surface — `setup:`
  # arrays, single-fragment actions, and step_fragment items inside an action
  # array. `step_kind_action` extends it with `mutation` and `wait`, which
  # only have meaning inside an `action_steps_block`: `mutation` changes
  # state between adjacent steps, `wait` advances the cassette clock between
  # them. The two enums are deliberately separate so `setup:` and the
  # shorthand `action: { type, body }` reject `mutation` / `wait` by
  # construction. See DECISIONS §8.
  step_kind_base:
    type: string
    description: >
      Step kinds valid in any step surface (`setup` arrays, single-fragment
      actions, fragment-array actions). See DECISIONS §8.
    enum: [code, shell, sql, dockerfile, data, logic]

  step_kind_action:
    type: string
    description: >
      Step kinds valid inside an `action_steps_block` — extends `step_kind_base`
      with `mutation` (state change between adjacent steps) and `wait`
      (advances the cassette clock). See DECISIONS §8.
    enum: [code, shell, sql, dockerfile, data, logic, mutation, wait]

  action_steps_block:
    type: object
    description: >
      Multi-step action form — an ordered list of `action_step` items.
      Required when using `mutation` or `wait` step kinds; for single-step
      actions a bare step_fragment is the canonical shorthand.
    required: [steps]
    additionalProperties: false
    properties:
      steps:
        type: array
        minItems: 1
        maxItems: 64
        items:
          $ref: "#/$defs/action_step"

  action_step:
    type: object
    description: >
      One step inside an `action_steps_block`. `id` is the binding target
      for `assertion.after_step`. `change` is required for `type: mutation`;
      `duration_seconds` is required for `type: wait`.
    additionalProperties: false
    required: [id, type]
    properties:
      id:
        type: string
        maxLength: 256
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Step identifier; assertions bind to this via `after_step:`."
      type:
        $ref: "#/$defs/step_kind_action"
      context:
        type: string
        maxLength: 256
        description: "References a key in top-level `contexts:`."
      body:
        type: string
        maxLength: 65536
        description: "Step content interpreted per `type` (code, shell, sql, …)."
      lang:
        type: string
        maxLength: 64
        description: "Language tag for `type: code` (e.g. python, javascript, go)."
      change:
        type: object
        maxProperties: 64
        description: "Key/value pairs applied between steps; required for `type: mutation`."
      duration_seconds:
        type: number
        description: "Cassette-clock advance in seconds; required for `type: wait`."
      inputs:
        description: "Inputs scoped to this step; merged with `differential.inputs`."

  # NOTE: additionalProperties is intentionally true — type-specific fields
  # (request, response, resource, action, etc.) vary per step kind and are
  # validated downstream by the verifier's per-type contract layer.
  step_fragment:
    type: object
    description: >
      Single-step action shorthand or one item in a fragment-array action.
      Type-specific fields beyond `type`/`lang`/`body` are validated
      downstream by the verifier (additionalProperties is open by design).
    required: [type]
    properties:
      type:
        $ref: "#/$defs/step_kind_base"
      lang:
        type: string
        maxLength: 64
        description: "Language tag for `type: code` (e.g. python, javascript, go)."
      body:
        description: "Step content; shape varies by `type` and is validated downstream."
    additionalProperties: true

  # ─── Assertion (§2) ──────────────────────────────────────────────────────
  # NOTE: additionalProperties is intentionally true — assertion-type-specific
  # fields (status_pattern, exception, value_equals, contains, etc.) form an
  # open vocabulary that is validated downstream by the verifier's per-type
  # contract layer (see DECISIONS.md §2).
  assertion:
    type: object
    description: >
      Branch outcome predicate. `type` selects a registered assertion kind;
      `expect` declares whether the branch should succeed or fail under that
      predicate. Type-specific fields (e.g. `status_pattern`, `exception`,
      `value_equals`) are validated downstream by the verifier. See
      DECISIONS §2.
    required: [type, expect]
    properties:
      type:
        enum:
          - status
          - raises
          - returns
          - plan_node
          - http_shape
          - output_match
          - value_equals
          - value_contains
          - value_not_equals
          - length_equals
          - collection_contains_type
          - compile_error_contains
          - compile_succeeds
          - custom
      expect:
        enum: [success, fail]
      module:
        type: string
        maxLength: 256
        description: "Required when type: custom"
      after_step:
        type: string
        maxLength: 256
        description: "Binds assertion to a specific action-step id."
      planning_time_seconds_gt:
        type: number
        minimum: 0
        description: >
          Per-branch action-level planning-time lower bound. When the
          assertion's `type: plan_node`, parses the captured stdout as
          `EXPLAIN (FORMAT JSON)` and asserts the `Planning Time` field
          (milliseconds, converted to seconds) is strictly greater than this
          value. Action-level analogue of
          `differential.{failed,working}_branch_planning_time_seconds_gt`. See
          runlog-verifier/internal/verify/spec.go::matchActionPlanNodeTiming.
      planning_time_seconds_lt:
        type: number
        minimum: 0
        description: >
          Per-branch action-level planning-time upper bound. When the
          assertion's `type: plan_node`, parses the captured stdout as
          `EXPLAIN (FORMAT JSON)` and asserts the `Planning Time` field
          (milliseconds, converted to seconds) is strictly less than this
          value. Action-level analogue of
          `differential.{failed,working}_branch_planning_time_seconds_lt`. See
          runlog-verifier/internal/verify/spec.go::matchActionPlanNodeTiming.
      # Type-specific fields (loose — individual types validate internals via
      # additional allOf branches at the platform level).
    additionalProperties: true
    allOf:
      - if: { properties: { type: { const: custom } } }
        then: { required: [module] }

  # ─── Verification ────────────────────────────────────────────────────────
  verification:
    type: object
    description: >
      Verifier configuration. Tier (`assertion_only` / `unit` / `integration`)
      drives which sibling fields are required: assertion_only needs
      `primitives_required`; unit needs `isolation`; integration needs
      `isolation` and `cassette`. The `differential` and `mutations` blocks
      define the falsifiability surface. See DECISIONS §2 (assertion vocab)
      and §3 (cassette).
    required: [type, differential, mutations, timeout_seconds]
    additionalProperties: false
    properties:
      type:
        enum: [assertion_only, unit, integration]
      isolation:
        enum:
          - function
          - subprocess
          - compiler
          - database
          - http_client
          - docker_daemon
      primitives_required:
        type: array
        maxItems: 64
        items:
          enum:
            - sha1
            - sha256
            - sha512
            - md5
            - base64
            - base64url
            - hex
            - utf8
            - json_canonical
            - yaml_load_1_1
            - yaml_load_1_2
            - add
            - sub
            - mul
            - div
            - mod
            - equal
            - not_equal
            - lt
            - gt
            - lte
            - gte
            - logic.and
            - logic.or
            - logic.not
            - logic.any
            - logic.all
            - string.matches_regex
            - string.matches_glob_arn
            - k8s.parse_quantity_to_milli
      cassette:
        $ref: "#/$defs/cassette"
      runtime:
        $ref: "#/$defs/runtime"
        description: >
          Names the host CLI the verifier drives at unit-tier when
          `isolation: subprocess`. Same shape as cassette.runtime but
          scoped to verification (no cassette involved at unit-tier).
          Required when type:unit + isolation:subprocess (enforced by
          the conditional `allOf` below); accepted but ignored on other
          tier/isolation combinations so seeds can carry it ahead of a
          tier change without rewriting.
      differential:
        $ref: "#/$defs/differential"
      differential_observations:
        $ref: "#/$defs/differential_observations"
      mutations:
        type: array
        minItems: 2
        maxItems: 64
        items:
          $ref: "#/$defs/mutation"
      timeout_seconds:
        type: number
        exclusiveMinimum: 0
        maximum: 300
    allOf:
      - if: { properties: { type: { const: assertion_only } } }
        then:
          required: [primitives_required]
          not: { required: [cassette] }
      - if: { properties: { type: { const: unit } } }
        then:
          required: [isolation]
      - if: { properties: { type: { const: integration } } }
        then:
          required: [isolation, cassette]
      - if:
          properties:
            type: { const: unit }
            isolation: { const: subprocess }
          required: [type, isolation]
        then:
          required: [runtime]

  # ─── Cassette (§3) ───────────────────────────────────────────────────────
  cassette:
    type: object
    description: >
      Recorded interaction artifact for integration-tier verification.
      `mode: replay` plays a captured request/response transcript; `mode:
      reexecute` re-runs the named host CLI in a sandbox built from
      `setup_script` + `runtime`. See DECISIONS §3.
    required: [mode, artifact, captures, strips, replay_targets]
    additionalProperties: false
    properties:
      mode:
        enum: [replay, reexecute]
      artifact:
        type: string
        maxLength: 256
        pattern: "^[a-z0-9][a-z0-9.-]+\\.(yaml|json)$"
      steps:
        type: object
        maxProperties: 256
        description: >
          Map of named request/response pairs keyed by step name. Step names
          are referenced from `branches.*.action[*].step` to pin a specific
          replay frame. See DECISIONS §3 for the cassette-step contract.
        additionalProperties:
          $ref: "#/$defs/cassette_step"
      runtime:
        $ref: "#/$defs/runtime"
      setup_script:
        type: array
        maxItems: 256
        description: >
          Reexecute-mode sandbox preparation. Shell commands run once per
          branch (and once per mutation re-run) before any branch action,
          with $-tokens substituted from inputs + $WORKDIR + (when tool is
          sqlite) $DB_PATH. A non-zero exit aborts the branch with
          `setup_script_failed`.
        items: { type: string, maxLength: 4096 }
      teardown_script:
        type: array
        maxItems: 256
        description: >
          Reexecute-mode sandbox cleanup. Shell commands run after each
          branch (and each mutation re-run), even on failure. Exit codes
          are not enforced — teardown is best-effort. The tmpdir is
          os.RemoveAll'd unconditionally afterwards.
        items: { type: string, maxLength: 4096 }
      captures:
        type: array
        minItems: 1
        maxItems: 256
        items: { type: string, maxLength: 1024 }
      strips:
        type: array
        minItems: 1
        maxItems: 256
        items: { type: string, maxLength: 1024 }
      replay_targets:
        type: array
        minItems: 1
        maxItems: 256
        items: { type: string, maxLength: 1024 }
      time_model:
        type: object
        maxProperties: 64
        description: "Simulated clock variables referenced in cassette steps."
      use_real_clock:
        type: boolean
        description: "When true on mode=reexecute, harness uses wall clock instead of simulated."
    allOf:
      # `mode` is in cassette.required, so the `if` clause never evaluates
      # vacuously — no defensive `required: [mode]` needed in the predicate.
      - if:
          properties: { mode: { const: reexecute } }
        then:
          required: [runtime]

  cassette_step:
    type: object
    description: >
      Named request/response pair inside `cassette.steps`. Step names are
      referenced from `differential.{failed,working}_approach_replay_sequence`
      to pin a specific replay frame.
    additionalProperties: false
    required: [request, response]
    properties:
      request: { type: string, maxLength: 65536 }
      response: { type: string, maxLength: 65536 }

  # ─── Runtime declaration ────────────────────────────────────────────────
  runtime:
    type: object
    description: >
      Names the host CLI the verifier drives — used by `cassette.runtime`
      (integration-tier reexecute) and `verification.runtime` (unit-tier
      subprocess isolation). Same shape on both sides; the driver registry
      is cross-tier, so a host that supports `tool: X` at one tier
      supports it at the other. v0.1 verifier implements `sqlite` and
      `shell`; the other enum members surface `runtime_unsupported` at
      run time.
    required: [tool]
    additionalProperties: false
    properties:
      tool:
        enum: [sqlite, shell, postgres, redis, git, docker]
      version:
        type: string
        maxLength: 256
        description: "Advisory version constraint (e.g. '>=3.7.0'); logged, not enforced in v0.1."
      share_state_across_mutations:
        type: boolean
        default: false
        description: >
          When true, mutation re-runs within a branch re-use the branch's
          provisioned sandbox (workdir + ephemeral resource) and skip the
          per-mutation re-execution of `cassette.setup_script`. Trades the
          per-mutation isolation invariant for performance — only safe when
          no mutation strategy targets a fixture or input that
          `setup_script` consumes, and when mutated actions are idempotent
          against the shared sandbox state (typically `--rm` containers,
          no state-mutating non-`--rm` commands). v0.1 verifier honors
          this flag only for `tool: docker` (where cold-start cost is
          ~30s/mutation); other tools provision in <1s and don't need
          the optimization. Cassettes that set this true with a non-docker
          tool surface the typed reason `share_state_unsupported_for_tool`
          at validation time.

  # ─── Differential (§4) ───────────────────────────────────────────────────
  # The closed, consumed half of the differential block. Every property
  # listed here is read by the Go verifier in
  # runlog-verifier/internal/verify/{shape,spec,integration,mutate}.go.
  # `additionalProperties: false` catches typos in load-bearing keys at
  # validation time — without the closure, a misspelled
  # `failed_branch_must_returns` would land in the open bag and the
  # verifier's matchOutcome would silently treat the branch as having no
  # expectation declared (spec.go:26 "no expectation declared — accept
  # silently"), bypassing the negative-falsifiability check.
  #
  # Free-form descriptive keys (failed_approach_assertion,
  # working_approach_observation, setup_sequence, …) belong in the sibling
  # `differential_observations` block; see below.
  differential:
    type: object
    description: >
      Closed bag of verifier-consumed differential keys (inputs, must-raise /
      must-return outcomes, replay-sequence pins, plan-node containment,
      planning-time thresholds, collection-property duplicates). Free-form
      descriptive keys go in the sibling `differential_observations`. See
      DECISIONS §4.
    additionalProperties: false
    maxProperties: 64
    properties:
      inputs:
        oneOf:
          - type: object
            description: "Per-branch inputs."
            additionalProperties: false
            required: [failed_approach, working_approach]
            properties:
              failed_approach: { type: object, maxProperties: 256 }
              working_approach: { type: object, maxProperties: 256 }
          - type: object
            description: "Shared inputs across both branches."
            maxProperties: 256
            not:
              required: [failed_approach, working_approach]
      # The four `must_raise` / `must_return` keys are intentionally
      # typed as `{}` (any value): each one's accepted shape is a small
      # string-or-object DSL the verifier parses (see
      # runlog-verifier/internal/verify/spec.go::matchOutcome). Constraining
      # them at the schema level would force every shape variant into the
      # YAML, when the verifier is the canonical contract for what's
      # accepted. The closure of `differential` itself (above) is what
      # protects against typos in the *key name*; key-internal validation
      # lives downstream.
      failed_branch_must_raise: {}
      failed_branch_must_return: {}
      working_branch_must_raise: {}
      working_branch_must_return: {}
      failed_branch_must_fail_with:
        type: string
        maxLength: 4096
        description: >
          Reserved for a v0.2 verifier slice. Not consumed by v0.1 — see
          spec.go:28 ("failed_branch_must_fail_with is a separate spec
          key, deferred"). Submitters can set it for future tooling but
          it has no current effect on verification outcome.
      failed_approach_replay_sequence:
        type: array
        maxItems: 256
        items: { type: string, maxLength: 256 }
      working_approach_replay_sequence:
        type: array
        maxItems: 256
        items: { type: string, maxLength: 256 }
      failed_branch_must_contain_plan_node:
        type: string
        maxLength: 4096
        description: >
          Substring containment match against the failed branch's captured
          stdout (typically `EXPLAIN (FORMAT TEXT)` plan output). Passes when
          the string is found anywhere in the captured output. Pairs with
          `working_branch_must_contain_plan_node` to express a differential
          plan-shape assertion. See
          runlog-verifier/internal/verify/spec.go::matchPlanNodeContains.
      failed_branch_must_contain_plan_node_any:
        type: array
        maxItems: 64
        items: { type: string, maxLength: 4096 }
        description: >
          Any-of variant of `failed_branch_must_contain_plan_node`. Passes
          when at least one of the listed strings is found in the failed
          branch's captured stdout. Independent of the scalar sibling — both
          may be present (additive semantics).
      working_branch_must_contain_plan_node:
        type: string
        maxLength: 4096
        description: >
          Substring containment match against the working branch's captured
          stdout (typically `EXPLAIN (FORMAT TEXT)` plan output). Pairs with
          `failed_branch_must_contain_plan_node` for the differential. See
          runlog-verifier/internal/verify/spec.go::matchPlanNodeContains.
      working_branch_must_contain_plan_node_any:
        type: array
        maxItems: 64
        items: { type: string, maxLength: 4096 }
        description: >
          Any-of variant of `working_branch_must_contain_plan_node`. Passes
          when at least one of the listed strings is found in the working
          branch's captured stdout. Independent of the scalar sibling — both
          may be present (additive semantics).
      failed_branch_planning_time_seconds_gt:
        type: number
        minimum: 0
        description: >
          Minimum planning-time threshold for the failed branch. Parses the
          failed branch's `EXPLAIN (FORMAT JSON)` captured stdout and reads the
          `Planning Time` field (milliseconds, converted to seconds); asserts
          the value is strictly greater than this threshold. Independent of the
          `_lt` sibling — both may apply additively. See
          runlog-verifier/internal/verify/spec.go::matchPlanNodeTiming.
      failed_branch_planning_time_seconds_lt:
        type: number
        minimum: 0
        description: >
          Maximum planning-time threshold for the failed branch. Parses the
          failed branch's `EXPLAIN (FORMAT JSON)` captured stdout and reads the
          `Planning Time` field (milliseconds, converted to seconds); asserts
          the value is strictly less than this threshold. Independent of the
          `_gt` sibling — both may apply additively. See
          runlog-verifier/internal/verify/spec.go::matchPlanNodeTiming.
      working_branch_planning_time_seconds_gt:
        type: number
        minimum: 0
        description: >
          Minimum planning-time threshold for the working branch. Parses the
          working branch's `EXPLAIN (FORMAT JSON)` captured stdout and reads
          the `Planning Time` field (milliseconds, converted to seconds);
          asserts the value is strictly greater than this threshold. See
          runlog-verifier/internal/verify/spec.go::matchPlanNodeTiming.
      working_branch_planning_time_seconds_lt:
        type: number
        minimum: 0
        description: >
          Maximum planning-time threshold for the working branch. Parses the
          working branch's `EXPLAIN (FORMAT JSON)` captured stdout and reads
          the `Planning Time` field (milliseconds, converted to seconds);
          asserts the value is strictly less than this threshold. See
          runlog-verifier/internal/verify/spec.go::matchPlanNodeTiming.
      failed_branch_collection_has_duplicates:
        type: boolean
        description: >
          Parses the failed branch's captured stdout as a newline-separated
          collection (each line trimmed, empty lines dropped) and asserts
          whether it contains duplicates. `true` requires duplicates present;
          `false` requires all lines be unique. See
          runlog-verifier/internal/verify/spec.go::matchCollectionProperty and
          parseCollectionLines.
      working_branch_collection_has_duplicates:
        type: boolean
        description: >
          Parses the working branch's captured stdout as a newline-separated
          collection (each line trimmed, empty lines dropped) and asserts
          whether it contains duplicates. `true` requires duplicates present;
          `false` requires all lines be unique. See
          runlog-verifier/internal/verify/spec.go::matchCollectionProperty and
          parseCollectionLines.

  # ─── Differential observations (§4) ──────────────────────────────────────
  # Open bag for descriptive keys that document the differential test in
  # human terms but are NOT read by the verifier or server. Today's seed
  # corpus uses keys like failed_approach_assertion,
  # working_approach_assertion, failed_approach_observation,
  # working_approach_observation, setup_sequence, and
  # working_branch_must_contain_plan_node here. New descriptive keys are
  # accepted without schema changes — that's by design. If a key here
  # later becomes load-bearing (the verifier wants to enforce it), it
  # gets promoted into `differential` with a typed declaration, and seeds
  # move it across in the same release.
  differential_observations:
    type: object
    description: >
      Open bag for descriptive differential keys that document the test in
      human terms but are not consumed by the verifier or server. Sibling to
      `differential`. New descriptive keys are accepted without schema
      changes by design.
    additionalProperties: true
    maxProperties: 64

  # ─── Mutation (§4) ───────────────────────────────────────────────────────
  mutation:
    type: object
    description: >
      Falsifiability probe — flips one element of the working_approach branch
      and asserts the resulting outcome. Several fields are strategy-dependent:

        strategy: set_literal_value     — uses `target` (the `$LITERAL_*` token)
                                          and `new_value`.
        strategy: remove_kwarg          — uses `target` (the kwarg name).
        strategy: swap_identifier       — uses `target` and `new_value` (old/new
                                          identifier names).
        strategy: drop_flag             — uses `target` (the flag).
        strategy: swap_function_call    — uses `target` and `new_value` (old/new
                                          callable names).
        strategy: mutate_fixture        — uses `target` (the `$FIXTURE_*` token),
                                          `token` (path inside the fixture), and
                                          `new_value`.
        strategy: mutate_cassette_response — uses `target` (the cassette step
                                          name), `field` (response selector:
                                          `body`, `status`, or `header.<NAME>`;
                                          legacy seeds may still carry the
                                          selector under `action` and remain
                                          valid), and `new_value`.
        strategy: custom                — requires `module`; the named module
                                          implements the mutation.
    required: [strategy, target]
    properties:
      strategy:
        enum:
          - set_literal_value
          - remove_kwarg
          - swap_identifier
          - drop_flag
          - swap_function_call
          - mutate_fixture
          - mutate_cassette_response
          - custom
        description: "Mutation kind. See the per-strategy field matrix on this object's description."
      target:
        type: string
        maxLength: 256
        description: >
          Strategy-dependent target selector — a `$LITERAL_*` token, kwarg name,
          identifier, flag, `$FIXTURE_*` token, or cassette step name. See the
          per-strategy field matrix on this object's description.
      new_value:
        description: >
          Replacement value for strategies that substitute (`set_literal_value`,
          `swap_identifier`, `swap_function_call`, `mutate_fixture`,
          `mutate_cassette_response`). Type follows the strategy.
      token:
        type: string
        maxLength: 256
        description: >
          For `mutate_fixture`, the path/key inside the fixture being mutated.
          Unused for other strategies.
      field:
        type: string
        maxLength: 256
        description: >
          For `mutate_cassette_response`, the response field selector: `body`,
          `status`, or `header.<NAME>`. Replaces `action` for this strategy
          (which dual-purposed as a `custom`-strategy hook AND a
          cassette-response selector — F22 soft TODO closed by F76 in
          schema 0.4.1). New seeds SHOULD use `field`; consumers MUST
          accept either `field` (preferred) or `action` (legacy) and treat
          them as equivalent until a future major bump retires `action`
          for cassette-response.
      action:
        type: string
        maxLength: 256
        description: >
          Legacy slot — for `mutate_cassette_response` this was the response
          field selector before F76 split it into a dedicated `field` key
          (schema 0.4.1). Consumers MUST still accept `action` here for
          back-compat with in-flight seeds; new seeds SHOULD use `field`.
          For other strategies this slot is reserved for future per-strategy
          use; today it is informational.
      module:
        type: string
        maxLength: 256
        description: "Required when `strategy: custom`; names the module that implements the mutation."
      branch:
        enum: [failed_approach, working_approach, both]
        description: "Which branch the mutation applies to (default: working_approach)."
      expected_result:
        enum: [fail, unchanged, pass, inapplicable]
        description: >
          Whole-mutation expected outcome. Use this OR
          `expected_branch_outcome`, not both. Note: this enum is the
          per-branch enum minus `assertion_does_not_match`, which is only
          meaningful per-branch (a whole-mutation outcome can't separate
          "the assertion didn't bind" from "the branch behaved as
          unchanged" — only the per-branch view can).
      expected_branch_outcome:
        type: object
        maxProperties: 16
        additionalProperties:
          enum: [fail, unchanged, pass, inapplicable, assertion_does_not_match]
        description: >
          Per-branch expected outcome map. Use this OR `expected_result`,
          not both. The value enum is `expected_result`'s enum plus
          `assertion_does_not_match` — the latter signals that the branch
          ran but the assertion did not bind to a captured value (typically
          when the mutation invalidates the assertion's selector).
    oneOf:
      - required: [expected_result]
      - required: [expected_branch_outcome]
    allOf:
      - if: { properties: { strategy: { const: custom } } }
        then: { required: [module] }


# ─── Submission-time global rules ──────────────────────────────────────────
#
# These constraints are enforced at runlog_submit time, layered on top of
# pure JSON Schema validation (which can't express them directly):
#
#   1. At least one mutation with `strategy: mutate_fixture`.
#   2. At least one mutation with `expected_result: fail` or
#      `expected_branch_outcome: {* : fail}`.
#   3. At least one mutation with `expected_result: unchanged` or
#      `expected_branch_outcome: {* : unchanged}`.
#   4. Every `$LITERAL_N` referenced in branches must be declared in `literals:`.
#   5. Every `$FIXTURE_*` referenced must be declared in `fixtures:`.
#   6. Every action-step `context:` reference must exist in `contexts:`.
#   7. Every `primitives_required` entry must be in the registered set.
#   8. For `type: assertion_only`, branches must not contain `shell` steps.
#      Enforced in server/src/runlog/sanitize/submit_rules.py rule 8.
#   9. (removed — the `compile_*` assertion-type rule was not enforceable:
#      the canonical compiler-tier seed uses `type: raises`/`type: returns`
#      with extra fields, and `primitives_required` has no `compile_*` enum
#      values.  The constraint is revisited when the verifier formalises the
#      compiler isolation harness.)
#  10. Every `domain[*]` must resolve to a public source per the scope rule
#      (the SCOPE_REGISTRY service, populated from package registries and
#      documented public APIs).
#
# Reference: `../docs/04-submission-format.md §7.0`.
