name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validator deps
        run: pip install --upgrade pyyaml jsonschema

      # The schemas are YAML *of* a JSON Schema. We must verify both that
      # each file is well-formed YAML and that the loaded structure is a
      # syntactically valid JSON Schema (Draft 2020-12 per $schema). A
      # broken root contract would silently propagate to verifier, server,
      # and skills, so this gate must fail loudly.
      - name: Validate *.schema.yaml
        run: |
          python - <<'PY'
          import glob, sys, yaml
          from jsonschema import Draft202012Validator

          failed = False
          for path in sorted(glob.glob("*.schema.yaml")):
              try:
                  with open(path) as fp:
                      schema = yaml.safe_load(fp)
              except yaml.YAMLError as e:
                  print(f"::error file={path}::YAML parse error: {e}")
                  failed = True
                  continue
              try:
                  Draft202012Validator.check_schema(schema)
              except Exception as e:
                  print(f"::error file={path}::Invalid JSON Schema: {e}")
                  failed = True
                  continue
              print(f"{path}: OK")
          sys.exit(1 if failed else 0)
          PY

  # F28a: smoke the Go module that wraps the canonical schemas
  # (go.mod at repo root; see DECISIONS.md). Catches regressions where
  # an embed file is renamed, the wrapper drifts from the schemas, or a
  # new dep gets pulled in without go.sum being committed.
  generators-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      # `go mod tidy` must be a no-op in CI: any drift means a contributor
      # forgot to commit go.sum or a stale dependency lingered. Mirrors the
      # gate the verifier workflow gained alongside this job.
      - name: Tidy is clean
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go mod tidy produced changes; commit go.mod/go.sum"
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # F28c: smoke the Python distribution under generators/python/.
  # The bundled _data/*.yaml are committed copies of the canonical
  # schemas at the repo root; this job fails if they drift. Then it
  # installs the package (which exercises the hatchling build) and
  # runs the pytest suite that mirrors the Go test invariants.
  python-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # Bundled copies must match the canonical files byte-for-byte:
      # the two YAML schemas plus VERSION (which drives both the Go
      # SchemaVersionConst and the Python package's version + module
      # SCHEMA_VERSION constant). If any drift, run
      # `bash generators/python/scripts/sync_schemas.sh` locally and
      # commit the result alongside the canonical edit.
      - name: Bundled schemas match canonical
        run: |
          set -e
          for f in entry.schema.yaml manifest.schema.yaml VERSION; do
            if ! cmp -s "$f" "generators/python/runlog_schema/_data/$f"; then
              echo "::error file=generators/python/runlog_schema/_data/$f::drifted from canonical $f; run generators/python/scripts/sync_schemas.sh"
              diff -u "$f" "generators/python/runlog_schema/_data/$f" || true
              exit 1
            fi
            echo "$f: in sync"
          done

      - name: Install package
        run: pip install './generators/python[test]'

      - name: Pytest
        run: pytest -v generators/python/tests/
