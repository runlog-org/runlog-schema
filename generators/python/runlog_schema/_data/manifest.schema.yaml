$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://runlog.org/schemas/manifest/v1.json"
title: "Runlog Session Manifest"
description: |
  Dependency manifest the agent submits with runlog_report so the
  platform can correlate delayed failures across thousands of agents.
  See docs/03-verification-and-provenance.md §6.

type: object
additionalProperties: false
required: [version, retrieved_at, entries]

properties:

  version:
    const: "1"

  retrieved_at:
    type: string
    format: date-time     # RFC 3339 / ISO-8601 with timezone

  client:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string, maxLength: 64 }
      version: { type: string, maxLength: 32 }

  runtime:
    type: object
    additionalProperties: false
    properties:
      os: { type: string, maxLength: 32 }
      os_version: { type: string, maxLength: 64 }
      arch: { type: string, maxLength: 16 }
      language: { type: string, maxLength: 32 }
      language_version: { type: string, maxLength: 32 }

  entries:
    type: array
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required: [kb_id, retrieved, status]
      properties:
        kb_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{3,127}$"
          description: "The unit_id of a Runlog entry."
        retrieved:
          type: string
          format: date-time
          description: "When the agent retrieved this entry."
        topic:
          type: string
          maxLength: 200
          description: "Human-readable topic the agent matched against."
        status:
          enum: [unverified, verified, degraded]
        confidence:
          type: number
          minimum: 0
          maximum: 1
