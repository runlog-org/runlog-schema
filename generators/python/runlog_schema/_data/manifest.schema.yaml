$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://runlog.org/schemas/manifest/v1.json"
title: "Runlog Session Manifest"
description: |
  Dependency manifest the agent submits with runlog_report so the
  platform can correlate delayed failures across thousands of agents.
  See docs/03-verification-and-provenance.md §6.

type: object
additionalProperties: false
required: [version, retrieved_at, entries]

properties:

  version:
    const: "1"
    description: >
      Manifest format version — pinned to "1" for the v1 generation of
      the format. Distinct from the runlog-schema package version (see
      VERSION at repo root): the format version only bumps on
      breaking changes to this manifest's shape, while the package
      version tracks any release of the schemas.

  retrieved_at:
    type: string
    format: date-time     # RFC 3339 / ISO-8601 with timezone
    description: >
      When the manifest was assembled by the agent. RFC 3339 / ISO-8601
      timestamp with timezone offset.

  client:
    type: object
    description: >
      Identifies the MCP client that fetched the manifest's entries
      (e.g. an MCP adapter name and its version).
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        maxLength: 64
        description: "Client name (e.g. an MCP adapter identifier)."
      version:
        type: string
        maxLength: 32
        description: "Client version string."

  runtime:
    type: object
    description: >
      Snapshot of the agent's host runtime at retrieval time. Used to
      correlate delayed failures across heterogeneous environments.
    additionalProperties: false
    properties:
      os:
        type: string
        maxLength: 32
        description: "Operating-system family (e.g. linux, darwin, windows)."
      os_version:
        type: string
        maxLength: 64
        description: "OS version or release identifier."
      arch:
        type: string
        maxLength: 16
        description: "CPU architecture (e.g. x86_64, arm64)."
      language:
        type: string
        maxLength: 32
        description: "Primary language runtime (e.g. python, node, go)."
      language_version:
        type: string
        maxLength: 32
        description: "Language runtime version string."

  entries:
    type: array
    maxItems: 100
    description: >
      The Runlog entries the agent retrieved during this session. Capped
      at 100; the platform correlates these against later failure reports.
    items:
      type: object
      description: >
        One retrieved entry — its identifier, when it was fetched, the
        topic the agent matched against, and the verification status the
        agent observed.
      additionalProperties: false
      required: [kb_id, retrieved, status]
      properties:
        kb_id:
          type: string
          # Pattern MUST stay byte-identical with
          # entry.schema.yaml#/properties/unit_id/pattern — kb_id is the
          # manifest's reference to a Runlog entry's unit_id, so a
          # divergence here would let the manifest accept identifiers the
          # entry schema rejects (or vice versa). Cross-file $ref isn't
          # used because each schema is published as an independent
          # artifact under its own $id.
          pattern: "^[a-z0-9][a-z0-9-]{3,127}$"
          description: >
            The unit_id of a Runlog entry. Pattern is held byte-identical
            with `entry.schema.yaml#/properties/unit_id/pattern`.
        retrieved:
          type: string
          format: date-time
          description: "When the agent retrieved this entry."
        topic:
          type: string
          maxLength: 200
          description: "Human-readable topic the agent matched against."
        status:
          enum: [unverified, verified, degraded]
          description: "Verification status the agent observed for the entry."
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Optional 0..1 confidence score the agent assigned to the
            topic match.
